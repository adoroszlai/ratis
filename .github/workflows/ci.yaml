name: CI

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: Ratis git ref (branch, tag or commit hash)
        default: ''
        required: false
    secrets:
      DEVELOCITY_ACCESS_KEY:
        description: 'Token for submitting build scan to Develocity'
        required: false
      SONARCLOUD_TOKEN:
        description: 'Token for submitting coverage data to SonarCloud'
        required: false

permissions: { }

jobs:
  build:
    uses: ./.github/workflows/check.yaml
    strategy:
      matrix:
        distro:
          - adopt
          - corretto
          - dragonwell
          - jetbrains
          - microsoft
          - oracle
          - semeru
          - temurin
          - zulu
      fail-fast: false
    with:
      java-distro: ${{ matrix.distro }}
      script: build
      script-args: -Prelease -am -pl :ratis-proto
      split: ${{ matrix.distro }}
      timeout-minutes: 30
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
